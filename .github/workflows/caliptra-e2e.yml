# End-to-end HSLSA example on a Caliptra part, from RTL to a booted device.
#
# "produce" is the design house, firmware team, fab, OSAT, test house with its
# programming station, and product owner: it builds the real Caliptra ROM and
# firmware, lints the real RTL, merges the ROM, signs every record, programs
# each unit's fuses and flash, and exports each unit's IDevID CSR from the real
# ROM. "verify" is the buyer: it powers on the units it received (Caliptra's
# emulator running that ROM and firmware), walks the chain from each device's
# certificates back to the RTL, signs VSAs and checks them with slsa-verifier.
#
# "verify-rtl" is the same buyer with the device built from the released RTL
# instead of the emulator. The RTL runs a few hundred to a thousand cycles a
# second, so it runs only when dispatched by hand with rtl set. rtl-stage
# "identity" runs the ROM until it exports each unit's IDevID CSR, which fits a
# hosted runner (about 3.5 hours for one unit); "boot" boots to runtime and
# needs a runner without the 6-hour job limit.
#
# Private by design, like hslsa-e2e.yml: local keys and DSSE envelopes, no OIDC
# token, nothing sent to Sigstore. See docs/caliptra-e2e.md.
name: HSLSA Caliptra end-to-end

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - e2e/caliptra/**
      - tools/**
      - go.mod
      - go.sum
      - hbom/**
      - .github/workflows/caliptra-e2e.yml
  workflow_dispatch:
    inputs:
      rtl:
        description: Also boot units on the Verilated RTL (takes hours)
        type: boolean
        default: false
      rtl-units:
        description: How many received units to run on the RTL
        type: number
        default: 1
      rtl-stage:
        description: "identity: ROM to the IDevID CSR (about 2 hours). boot: to runtime (longer than a hosted runner allows)"
        type: choice
        options: [identity, boot]
        default: identity
      rtl-runner:
        description: Runner label for the RTL job (a self-hosted runner for rtl-stage boot)
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: hslsa-caliptra-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.96"
  SLSA_VERIFIER_VERSION: v2.7.1
  # sha256 of slsa-verifier-linux-amd64 v2.7.1, from SHA256SUM.md in slsa-framework/slsa-verifier
  SLSA_VERIFIER_SHA256: 946dbec729094195e88ef78e1734324a27869f03e2c6bd2f61cbc06bd5350339

jobs:
  produce:
    name: Produce (RTL, firmware, lot, provisioning)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Verilator
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends verilator
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target riscv32imc-unknown-none-elf
          echo "CARGO_TERM_COLOR=never" >> "$GITHUB_ENV"
      - name: Fetch Caliptra sources at the pinned commits
        run: e2e/caliptra/run.sh fetch
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            e2e/caliptra/.src/caliptra-sw/target
            e2e/caliptra/device/target
          key: caliptra-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('e2e/caliptra/caliptra.lock.json', 'e2e/caliptra/device/Cargo.lock', 'e2e/caliptra/device/src/**') }}
          restore-keys: caliptra-cargo-${{ env.RUST_TOOLCHAIN }}-
      - name: Build the ROM, firmware and device model
        run: e2e/caliptra/run.sh build
      - name: Run the chain and sign every record
        run: e2e/caliptra/run.sh produce
      - name: Remove private keys before upload
        run: rm -rf out/caliptra/keys
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hslsa-caliptra-bundle
          path: out/caliptra/bundle
          if-no-files-found: error
          retention-days: 14
      # The shipped parts: each unit's fuse bank and flash, and the mask ROM they all carry.
      # The fuse files hold simulated UDS seeds, which in silicon never leave the die.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hslsa-caliptra-devices
          path: out/caliptra/devices
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hslsa-caliptra-device-model
          path: out/caliptra/build/hslsa-caliptra-device
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Verify (buyer boots the units)
    needs: produce
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hslsa-caliptra-bundle
          path: out/caliptra/bundle
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hslsa-caliptra-devices
          path: out/caliptra/devices
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hslsa-caliptra-device-model
          path: out/caliptra/build
      - run: chmod +x out/caliptra/build/hslsa-caliptra-device
      - name: Install slsa-verifier ${{ env.SLSA_VERIFIER_VERSION }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/slsa-verifier" \
            "https://github.com/slsa-framework/slsa-verifier/releases/download/${SLSA_VERIFIER_VERSION}/slsa-verifier-linux-amd64"
          echo "${SLSA_VERIFIER_SHA256}  $RUNNER_TEMP/slsa-verifier" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/slsa-verifier"
          echo "SLSA_VERIFIER=$RUNNER_TEMP/slsa-verifier" >> "$GITHUB_ENV"
      - name: Boot the received units, check the chain, sign VSAs, verify them with slsa-verifier
        env:
          HSLSA_VSA_SIGNING_KEY: ${{ secrets.HSLSA_VSA_SIGNING_KEY }}
        run: e2e/caliptra/run.sh verify | tee verify.log
      - name: Tamper tests
        run: go test -v -count=1 ./tools/hslsa/ | tee tamper.log
      - name: Summary
        if: always()
        run: |
          {
            echo "## HSLSA Caliptra end-to-end"
            echo '```'
            grep -v "^PASSED: SLSA verification passed$\|^$" verify.log 2>/dev/null || true
            echo '```'
            echo "### Tamper tests"
            echo '```'
            grep -E "^(--- |ok|FAIL)" tamper.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hslsa-caliptra-boots
          path: |
            out/caliptra/boots
            out/caliptra/vsa
          if-no-files-found: warn
          retention-days: 14

  verify-rtl:
    name: Verify on the RTL (buyer boots units on the Verilated design)
    needs: produce
    if: github.event_name == 'workflow_dispatch' && inputs.rtl
    runs-on: ${{ inputs.rtl-runner }}
    # 6 hours is GitHub's limit for a hosted job; a self-hosted one may run 5 days.
    timeout-minutes: ${{ inputs.rtl-stage == 'boot' && 7200 || 360 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Verilator
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends verilator
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "CARGO_TERM_COLOR=never" >> "$GITHUB_ENV"
      - name: Fetch Caliptra sources at the pinned commits
        run: e2e/caliptra/run.sh fetch
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hslsa-caliptra-bundle
          path: out/caliptra/bundle
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hslsa-caliptra-devices
          path: out/caliptra/devices
      - name: Install slsa-verifier ${{ env.SLSA_VERIFIER_VERSION }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/slsa-verifier" \
            "https://github.com/slsa-framework/slsa-verifier/releases/download/${SLSA_VERIFIER_VERSION}/slsa-verifier-linux-amd64"
          echo "${SLSA_VERIFIER_SHA256}  $RUNNER_TEMP/slsa-verifier" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/slsa-verifier"
          echo "SLSA_VERIFIER=$RUNNER_TEMP/slsa-verifier" >> "$GITHUB_ENV"
      # No cache on purpose: the model is Verilated fresh from the released design on every run.
      - name: Verilate the released design into the device model
        run: e2e/caliptra/run.sh build-rtl
      - name: Run the units on the RTL and check them (${{ inputs.rtl-stage }})
        env:
          HSLSA_VSA_SIGNING_KEY: ${{ secrets.HSLSA_VSA_SIGNING_KEY }}
          RTL_UNITS: ${{ inputs.rtl-units }}
          RTL_STAGE: ${{ inputs.rtl-stage }}
        run: e2e/caliptra/run.sh verify-rtl | tee verify-rtl.log
      - name: Summary
        if: always()
        run: |
          {
            echo "## HSLSA Caliptra on the RTL"
            echo '```'
            cat out/caliptra/build/verilator-version.txt 2>/dev/null || true
            grep -v "^PASSED: SLSA verification passed$\|^$" verify-rtl.log 2>/dev/null | grep -v "^boot: .* cycles, " || true
            grep "^boot: .* cycles, " verify-rtl.log 2>/dev/null | tail -1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hslsa-caliptra-rtl-boots
          path: |
            out/caliptra/build/rtl-model/rtl.json
            out/caliptra/build/verilator-version.txt
            out/caliptra/boots-rtl
            out/caliptra/vsa-rtl
            out/caliptra/identity-rtl
          if-no-files-found: warn
          retention-days: 14
