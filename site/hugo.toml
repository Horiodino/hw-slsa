# The documentation website. Its pages are made from the repository's own
# markdown by site/gen; see site/README.md for how to build and preview it.
title = "HSLSA"
languageCode = "en"
baseURL = "/"
# Relative links and .html page names let the built site be opened straight
# from disk, and served from GitHub Pages under /hw-slsa/ unchanged.
relativeURLs = true
uglyURLs = true
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]
enableRobotsTXT = false

[params]
repo = "https://github.com/Horiodino/hw-slsa"
# Set by the build: HUGO_PARAMS_COMMIT=<sha>.
commit = ""
# The site is public on GitHub Pages; true keeps search engines away.
noindex = false

[outputs]
home = ["html", "searchindex"]

[outputFormats.searchindex]
mediaType = "text/javascript"
baseName = "search-index"
isPlainText = true
notAlternative = true

[markup.goldmark.parser]
autoHeadingIDType = "github"

[markup.highlight]
noClasses = false
guessSyntax = false

[markup.tableOfContents]
startLevel = 2
endLevel = 3
