# End-to-end test of the HSLSA chain for the PicoRV32 example.
#
# Three jobs play three parties. "produce" is the design house and its
# suppliers: it runs the real RTL flow and signs every record. "verify" is the
# buyer: it gets only the public bundle, checks the whole chain, signs VSAs
# and verifies them with the official slsa-verifier release, then checks the
# bundles again without tools/hslsa: openssl verifies the signatures and the
# official OPA release evaluates the buyer rules in policies/rego (see
# docs/rego-policies.md). "escrow" plays an
# auditor who gets a lot's records with confidential fields withheld plus their
# disclosures, and a buyer who gets only the auditor's VSAs; see
# docs/selective-disclosure.md.
#
# Private by design: signing uses local ECDSA keys in DSSE envelopes, and no
# job requests an OIDC token or talks to Sigstore, so nothing about this repo
# reaches a public transparency log. See docs/e2e-test.md.
name: HSLSA end-to-end

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this as one of the tests a release must pass.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: hslsa-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  SLSA_VERIFIER_VERSION: v2.7.1
  # sha256 of slsa-verifier-linux-amd64 v2.7.1, from SHA256SUM.md in slsa-framework/slsa-verifier
  SLSA_VERIFIER_SHA256: 946dbec729094195e88ef78e1734324a27869f03e2c6bd2f61cbc06bd5350339
  CYCLONEDX_CLI_VERSION: v0.32.0
  # sha256 of cyclonedx-linux-x64 v0.32.0, as listed on the CycloneDX/cyclonedx-cli release page
  CYCLONEDX_CLI_SHA256: 454879e6a4a405c8a13bff49b8982adcb0596f3019b26b0811c66e4d7f0783e1
  OPA_VERSION: v1.21.1
  # sha256 of opa_linux_amd64_static v1.21.1, the asset digest listed on the open-policy-agent/opa v1.21.1 release page
  OPA_SHA256: 668506eb17a2eaa1fce6cc0d1f42ef85125d4ac5bda5fc74d1152d0c77145031

jobs:
  lint:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt and go vet
        run: |
          unformatted=$(gofmt -l .)
          [[ -z $unformatted ]] || { echo "gofmt needed: $unformatted"; exit 1; }
          go vet ./...
      # The summary names the tests that hand the checks valid records and
      # require them to pass, besides counting those that break or forge one.
      # Without the e2e bundles the chain tests skip here; the produce and
      # verify jobs run them.
      - name: Unit tests
        run: e2e/unit-tests.sh "Unit tests" ./...
      - name: Known vulnerabilities in the Go toolchain and modules (govulncheck; v1.8 needs Go 1.26)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Validate the committed HBOM examples against their schema
        run: go run ./tools/hslsa/cmd/hslsa validate-hbom hbom/picosoc-sky130.hbom.intoto.json hbom/picosoc-devboard.hbom.intoto.json

  produce:
    name: Produce (design flow and lot)
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The versions are pinned because the example's Design L3 policy pins
      # these packages' binaries and files by digest (design.toolPins).
      - name: Install Yosys, Icarus Verilog, SoftHSM2 and bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends yosys=0.33-5build2 iverilog=12.0-2build2 softhsm2 bubblewrap
      # Ubuntu 24.04 stops unprivileged processes from making user namespaces,
      # which the sandbox the design steps run in needs.
      - name: Allow the sandbox to make user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the flow, design steps isolated, and sign every step
        run: e2e/run.sh produce
      - name: Design L3, as an independent party, prove the netlist equal to the RTL again
        run: e2e/run.sh rerun
      - name: Design L3 and L4 tests with Yosys, the rerun catching an altered netlist and the second builder's rebuild
        env:
          HSLSA_REQUIRE_YOSYS: "1"
        run: e2e/unit-tests.sh "Design L3 and L4 tests, with Yosys" -count=1 -run 'RerunEquivalence|DesignL4|DesignRebuild' ./tools/hslsa/
      - name: Install slsa-verifier ${{ env.SLSA_VERIFIER_VERSION }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/slsa-verifier" \
            "https://github.com/slsa-framework/slsa-verifier/releases/download/${SLSA_VERIFIER_VERSION}/slsa-verifier-linux-amd64"
          echo "${SLSA_VERIFIER_SHA256}  $RUNNER_TEMP/slsa-verifier" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/slsa-verifier"
          echo "SLSA_VERIFIER=$RUNNER_TEMP/slsa-verifier" >> "$GITHUB_ENV"
      - name: Wafer L3 and Package/Test L3, the lot with HSM site keys, die identities and challenged parts, under a buyer-run trust root
        run: e2e/run.sh l3
      - name: Assembly L3, the board on those chips, challenged at build, a platform certificate per board, challenged at receipt
        run: e2e/board/run.sh l3
      - name: Design L4, Wafer L4 and Package/Test L4, a second builder's rebuild, two reviewers, an HSM tapeout key and an independent lab's seeded inspection
        run: e2e/run.sh l4
      - name: Assembly L4, an independent lab's seeded inspection of the boards on the L3 chips
        run: e2e/board/run.sh l4
      - name: The same lot with suppliers that sign nothing, proxy-signed and checked
        run: e2e/run.sh proxy
      - name: The same lot made from the suppliers' MES and STDF exports, and checked against them
        run: e2e/run.sh adapt
      - name: Pilot rehearsal, the lot signed by the OSAT under a buyer-run trust root, checked and measured
        run: e2e/pilot/run.sh chip
      - name: A lot from the virtual shuttle, every die simulated gate-level, checked as simulated evidence
        run: e2e/run.sh shuttle
      - name: Virtual shuttle tests (same lot twice, swapped dies, unreleased netlist)
        run: go test -count=1 -run 'RV32|Shuttle' ./tools/hslsa/
      - name: HSM signing tests against SoftHSM2
        env:
          HSLSA_REQUIRE_PKCS11: "1"
        run: go test -count=1 -run 'HSM|PKCS11' ./tools/hslsa/
      - name: The release and the lot again, signed with site keys held in SoftHSM2, and checked
        run: e2e/run.sh hsm
      - name: Lint and synthesis in Yosys's Tcl shell, signed from the EDA Tcl hook
        run: |
          e2e/eda-tcl/run.sh
          go test -count=1 -run EDA ./tools/hslsa/
      - name: Build the board on the shipped chips and sign shipments, A1 and the board HBOM
        run: e2e/board/run.sh produce
      - name: Re-sign the lot with confidential fields withheld, for the escrow job
        run: e2e/escrow.sh produce
      - name: Remove private keys before upload
        run: rm -rf out/keys out/board-keys
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hslsa-bundle
          path: out/bundle
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hslsa-board-bundle
          path: out/board
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hslsa-shuttle-exports
          path: out/shuttle/exports
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hslsa-escrow-auditor
          path: out/escrow/bundle
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Verify (buyer)
    needs: produce
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hslsa-bundle
          path: out/bundle
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hslsa-board-bundle
          path: out/board
      - name: Install slsa-verifier ${{ env.SLSA_VERIFIER_VERSION }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/slsa-verifier" \
            "https://github.com/slsa-framework/slsa-verifier/releases/download/${SLSA_VERIFIER_VERSION}/slsa-verifier-linux-amd64"
          echo "${SLSA_VERIFIER_SHA256}  $RUNNER_TEMP/slsa-verifier" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/slsa-verifier"
          echo "SLSA_VERIFIER=$RUNNER_TEMP/slsa-verifier" >> "$GITHUB_ENV"
      - name: Check the chain, sign VSAs, verify them with slsa-verifier
        env:
          HSLSA_VSA_SIGNING_KEY: ${{ secrets.HSLSA_VSA_SIGNING_KEY }}
        run: e2e/run.sh verify | tee verify.log
      - name: Check the board, sign its VSA, verify it with slsa-verifier
        env:
          HSLSA_VSA_SIGNING_KEY: ${{ secrets.HSLSA_VSA_SIGNING_KEY }}
        run: e2e/board/run.sh verify | tee -a verify.log
      - name: Install OPA ${{ env.OPA_VERSION }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/opa" \
            "https://github.com/open-policy-agent/opa/releases/download/${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  $RUNNER_TEMP/opa" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/opa"
          echo "OPA=$RUNNER_TEMP/opa" >> "$GITHUB_ENV"
      - name: Rego policy tests (opa test), valid records accepted and broken ones refused
        run: |
          "$OPA" check --strict policies/rego
          "$OPA" fmt --fail -l policies/rego
          "$OPA" test policies/rego hslsa.hbom_schema:hbom/hbom-predicate-v0.1.schema.json
      - name: Independent check of the chip bundle, openssl and OPA, no tools/hslsa
        run: e2e/rego/run.sh --received e2e/picorv32/received-units.txt out/bundle | tee -a verify.log
      - name: Independent check of the board bundle, openssl and OPA, no tools/hslsa
        run: e2e/rego/run.sh --received e2e/board/received-boards.txt out/board | tee -a verify.log
      - name: Validate the CycloneDX renderings with the CycloneDX CLI ${{ env.CYCLONEDX_CLI_VERSION }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cyclonedx" \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/download/${CYCLONEDX_CLI_VERSION}/cyclonedx-linux-x64"
          echo "${CYCLONEDX_CLI_SHA256}  $RUNNER_TEMP/cyclonedx" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/cyclonedx"
          for bom in out/bundle/att/hbom.cdx.json out/board/att/hbom.cdx.json hbom/*.cdx.json; do
            echo "== $bom"
            "$RUNNER_TEMP/cyclonedx" validate --input-file "$bom" --input-format json --input-version v1_6 --fail-on-errors
          done
      - name: Chain tests on the produced bundles, valid records accepted and broken or forged ones refused
        run: e2e/unit-tests.sh "Chain tests on the produced bundles" -count=1 ./tools/hslsa/
      - name: Summary
        if: always()
        run: |
          {
            echo "## HSLSA end-to-end"
            echo '```'
            cat verify.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hslsa-vsa
          path: out/vsa
          if-no-files-found: error
          retention-days: 14

  escrow:
    name: Escrow (auditor, then buyer)
    needs: produce
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hslsa-escrow-auditor
          path: out/escrow/bundle
      - name: Install slsa-verifier ${{ env.SLSA_VERIFIER_VERSION }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/slsa-verifier" \
            "https://github.com/slsa-framework/slsa-verifier/releases/download/${SLSA_VERIFIER_VERSION}/slsa-verifier-linux-amd64"
          echo "${SLSA_VERIFIER_SHA256}  $RUNNER_TEMP/slsa-verifier" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/slsa-verifier"
          echo "SLSA_VERIFIER=$RUNNER_TEMP/slsa-verifier" >> "$GITHUB_ENV"
      - name: Auditor checks the full records with their disclosures and signs VSAs
        run: e2e/escrow.sh audit | tee escrow.log
      - name: Buyer checks the auditor's VSAs, holding nothing else
        run: e2e/escrow.sh buyer | tee -a escrow.log
      - name: Measure what the records and the VSAs reveal
        run: e2e/escrow.sh leaks > /dev/null
      - name: Summary
        if: always()
        run: |
          {
            echo "## HSLSA verifier escrow"
            echo '```'
            cat escrow.log 2>/dev/null || true
            echo '```'
            cat out/leaks/leaks.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hslsa-escrow-buyer
          path: |
            out/buyer/vsa
            out/buyer/auditor.pub.pem
            out/leaks
          if-no-files-found: error
          retention-days: 14
