# The documentation website: every page made from the repository's own
# markdown (site/gen), built with Hugo, every internal link and anchor
# checked, and the result uploaded as an artifact named docs-site.
#
# A push to main also publishes the site on GitHub Pages, which anyone can
# read. Pull requests only build and check it. See site/README.md.
name: Docs site

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - site/**
      - hbom/hbom-predicate-v0.1.schema.json
      - tools/hslsa/cmd/hslsa/**
      - .github/workflows/docs-site.yml
  pull_request:
    paths:
      - "**.md"
      - site/**
      - hbom/hbom-predicate-v0.1.schema.json
      - tools/hslsa/cmd/hslsa/**
      - .github/workflows/docs-site.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check the site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt and go vet (site generator)
        run: |
          unformatted=$(gofmt -l site)
          [[ -z $unformatted ]] || { echo "gofmt needed: $unformatted"; exit 1; }
          go vet ./site/...
      - name: Build the site and check its links
        run: site/build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: site/public
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site/public
      - name: Summary
        run: |
          pages=$(find site/public -name '*.html' | wc -l)
          {
            echo "### Docs site"
            echo
            echo "$pages pages built from commit \`${GITHUB_SHA::7}\`, every internal link and anchor checked."
            echo "Download **docs-site** from this run's artifacts, unzip it and open \`index.html\`."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
