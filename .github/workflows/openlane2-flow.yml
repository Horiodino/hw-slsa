# OpenLane 2 RTL-to-GDS for the spm example, with a signed record per step,
# rebuilt by a second builder and checked by a buyer.
#
# Three jobs play three parties, as in hslsa-e2e.yml. "flow" is the design
# house: it freezes the source, runs the pinned OpenLane image on the pinned
# SKY130 PDK, signs each step as it finishes, and signs the tapeout release of
# the final GDS. "rebuild" is a second builder on its own runner with its own
# keys: it gets only the release bundle, runs the same flow from the pinned
# inputs, compares every step, and signs a rebuild record with a key in a trust
# root of its own. "verify" is the buyer: the tapeout check, plus the rebuild
# record as Design L4 evidence, requiring a byte-identical GDS.
#
# Both builders run under this repository's GitHub account, so the rebuild is
# not yet operator-independent; see docs/openlane2-flow.md.
#
# Private by design, as in hslsa-e2e.yml: local ECDSA keys in DSSE
# envelopes, no OIDC token, nothing sent to a transparency log.
name: OpenLane 2 attested flow

on:
  push:
    branches: [main]
    paths: [openlane2/**, tools/hslsa/**, go.mod, go.sum, .github/workflows/openlane2-flow.yml]
  pull_request:
    paths: [openlane2/**, tools/hslsa/**, go.mod, go.sum, .github/workflows/openlane2-flow.yml]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: openlane2-flow-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CIEL_VERSION: "3.0.0"

jobs:
  flow:
    name: Flow and release (design house)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # ciel is the PDK manager OpenLane uses; it is a Python package.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ciel==${CIEL_VERSION}"
      - name: Pull the pinned OpenLane image
        run: docker pull "$(jq -r .openlane.image openlane2/spm/flow.lock.json)"
      - name: Enable the pinned SKY130 PDK
        run: |
          echo "PDK_ROOT=$RUNNER_TEMP/pdk" >> "$GITHUB_ENV"
          ciel enable --pdk-root "$RUNNER_TEMP/pdk" --pdk-family "$(jq -r .pdk.family openlane2/spm/flow.lock.json)" \
            "$(jq -r .pdk.openPdksCommit openlane2/spm/flow.lock.json)"
      - name: Run OpenLane and sign every step
        run: openlane2/run.sh produce
      - name: Remove private keys before upload
        if: always()
        run: rm -rf out/openlane2/keys
      - name: Summary
        if: always()
        run: |
          {
            echo "## Design house flow on $(uname -n)"
            echo '```'
            jq -c '{exitCode, steps: (.steps | length), unfinished}' out/openlane2/bundle/openlane/run.json 2>/dev/null || true
            tail -n 30 out/openlane2/bundle/openlane/openlane.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: openlane2-release
          path: out/openlane2/bundle
          if-no-files-found: error
          retention-days: 14

  rebuild:
    name: Rebuild (second builder)
    needs: flow
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The rebuilder signs under its own builder id, not the flow's.
      HSLSA_BUILDER_ID: ${{ github.server_url }}/${{ github.workflow_ref }}#rebuild
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ciel==${CIEL_VERSION}"
      - name: Pull the pinned OpenLane image
        run: docker pull "$(jq -r .openlane.image openlane2/spm/flow.lock.json)"
      - name: Enable the pinned SKY130 PDK
        run: |
          echo "PDK_ROOT=$RUNNER_TEMP/pdk" >> "$GITHUB_ENV"
          ciel enable --pdk-root "$RUNNER_TEMP/pdk" --pdk-family "$(jq -r .pdk.family openlane2/spm/flow.lock.json)" \
            "$(jq -r .pdk.openPdksCommit openlane2/spm/flow.lock.json)"
      # Only the release bundle crosses from the design house: no keys, no workspace.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openlane2-release
          path: ${{ runner.temp }}/release
      - name: Rebuild, compare every step, sign the rebuild record
        run: openlane2/run.sh rebuild "$RUNNER_TEMP/release"
      - name: Remove private keys before upload
        if: always()
        run: rm -rf out/openlane2/keys out/openlane2/rebuilder-keys
      - name: Summary
        if: always()
        run: cat out/openlane2/report/reproducibility.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openlane2-rebuild
          path: out/openlane2/report
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: openlane2-rebuild-bundle
          path: out/openlane2/bundle
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: Tapeout check with the rebuild (buyer)
    needs: [flow, rebuild]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openlane2-release
          path: runs/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openlane2-rebuild
          path: runs/rebuild
      - name: Verify the release and require a bit-exact rebuild from a separate trust root
        run: openlane2/run.sh verify runs/release runs/rebuild | tee verify.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "## Buyer tapeout check"
            echo '```'
            cat verify.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
